name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # The runner image ships an Android SDK with licenses pre-accepted;
      # AGP installs any missing platform/build-tools automatically.
      - name: Set up Gradle (caches wrapper and dependencies)
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APN-Manager-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to GitHub Release ("latest")
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk APN-Manager.apk
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest APN-Manager.apk --clobber
          else
            gh release create latest APN-Manager.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "APN Manager — latest build" \
              --notes "Automatic debug build from \`main\` (always the newest APK). Generated by GitHub Actions."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
